<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target data · taskimatic</title>
  <style>
    body { margin: 0; color: #202124; background: #f7f8fa;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 1; padding: 16px 20px;
      background: white; border-bottom: 1px solid #dfe3e8; }
    h1 { margin: 0 0 4px; font-size: 20px; }
    p { margin: 0 0 12px; color: #5f6368; }
    .actions { display: flex; gap: 8px; }
    button { padding: 7px 12px; border: 1px solid #aeb4bd; border-radius: 5px;
      background: white; color: #202124; font: inherit; cursor: pointer; }
    button:hover { background: #f0f2f5; }
    #status { margin-left: 8px; color: #0a5d25; }
    pre { margin: 16px 20px; padding: 16px; min-height: 180px; overflow: auto;
      border: 1px solid #dfe3e8; border-radius: 7px; background: white;
      color: #17212b; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <h1>Target data</h1>
    <p id="summary">Waiting for captured data…</p>
    <div class="actions">
      <button id="copyJson" type="button">Copy JSON</button>
      <button id="downloadJson" type="button">Download JSON</button>
      <span id="status" role="status" aria-live="polite"></span>
    </div>
  </header>
  <pre id="json"></pre>
  <script src="target-data.js"></script>
</body>
</html>
