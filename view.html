<!DOCTYPE html>
<html>
  <head>
    <title>Tabs, Bookmarks & History Manager</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage your open tabs, bookmarks, and history with ease.">
    <meta name="author" content="Matthew Quarneri">
    <meta name="keywords" content="tabs, bookmarks, history, data manager and getter, Chrome extension">
    <meta name="theme-color" content="#D00E00">
    <link rel="icon" href="icon310.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <style>
      body { font-family: sans-serif; margin: 0px; }
      h1 { margin: 10px 0 5px; }
      h2 { margin: 8px 0 4px; }
      ul { list-style-type: none; padding-left: 15px; }
      li { margin-bottom: 4px; }
      .folder { font-weight: bold; }
      button { margin-bottom: 10px; }
      label { display: block; margin: 8px 0 4px; font-weight: bold; }
      textarea {
        width: calc(100% - 10px);
        min-height: 58px;
        resize: vertical;
        box-sizing: border-box;
      }
      .content-actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .content-actions button {
        margin-bottom: 0;
      }
      .history-controls { align-items: center; }
      .history-controls input[type="search"] {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
      }
      .hint {
        color: #555;
        font-size: 12px;
        margin: 6px 0;
      }
      #quickReadStatus {
        color: #0a5d25;
        min-height: 18px;
        margin-top: 8px;
      }
      .target-switch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .target-switch input { appearance: none; width: 36px; height: 20px; margin: 0;
        border-radius: 999px; background: #aeb4bd; position: relative; cursor: pointer; }
      .target-switch input::before { content: ""; position: absolute; top: 2px; left: 2px;
        width: 16px; height: 16px; border-radius: 50%; background: white;
        transition: transform .15s ease; }
      .target-switch input:checked { background: #c00; }
      .target-switch input:checked::before { transform: translateX(16px); }
      .target-switch input:focus-visible { outline: 2px solid #202124; outline-offset: 2px; }
      #logo{
        position: absolute;
        top: 0px;
        right:0px;
        width: 100px;
        height: auto;
        float: right;
        z-index: 10;
      }
      #activities {
        position: relative;
        top: 10px;
        width: 520px;
        height: 400px; /* Adjust as needed */

      }
    </style>
  </head>
  <body>
    <a href="https://www.taskimatic.com" target="_blank">
      <img id="logo" src="brand.png" alt="taskimatic" title="taskimatic">
    </a>
    <tab-widget id="activities" default-tab="tabs">
      <div slot="tab-content" tab-content="content" tab-label="Content">
        <div class="content-actions">
          <button id="simplifyPageBtn">Simplify</button>
        </div>
        <h2>Quick Read</h2>
        <p class="hint">Formats the main readable text on the active page.</p>
        <label for="quickReadActionWords">Action words</label>
        <textarea id="quickReadActionWords" spellcheck="false"></textarea>
        <p class="hint">Separate words with commas, spaces, or line breaks.</p>
        <div class="content-actions">
          <button id="quickReadBtn">Quick Read</button>
          <button id="resetQuickReadWordsBtn">Reset Words</button>
        </div>
        <div id="quickReadStatus" aria-live="polite"></div>
        <h2>Target orders</h2>
        <label class="target-switch" for="processTargetDataSwitch">
          <input id="processTargetDataSwitch" type="checkbox" role="switch">
          Process Target data
        </label>
        <p class="hint">Adds a Get data button to Target's orders list and store purchase pages. Click it to add that page's data to a JSON window.</p>
        <button id="openTargetDataBtn" type="button">Open Target JSON</button>
        <div id="targetProcessingStatus" class="hint" aria-live="polite"></div>
      </div>
      <div slot="tab-content" tab-content="agent" tab-label="Agent">
        <p>Arriving Soon</p>
      </div>
      <div slot="tab-content" tab-content="tabs" tab-label="Tabs">
        <button id="save2JSON">Save to JSON</button>
        <ul id="tabsList"></ul>
      </div>
      <div slot="tab-content" tab-content="links" tab-label="Links">
        <button id="reorganizeBtn">Reorganize Bookmarks (Sort A-Z)</button>
        <div id="bookmarksContainer"></div>
      </div>
      <div slot="tab-content" tab-content="history" tab-label="History">
        <div class="content-actions">
          <button id="analyzeHistoryBtn">Analyze History</button>
          <button id="exportHistreeBtn" disabled>Export Histree JSON</button>
          <button id="exportHistreeLinksBtn" disabled>Export Links JSON</button>
        </div>
        <div class="content-actions history-controls">
          <input type="search" id="historySearchInput" placeholder="Search sites, titles, urls..." autocomplete="off">
          <select id="historySortSelect">
            <option value="time" selected>Sort: Time spent</option>
            <option value="popularity">Sort: Popularity</option>
            <option value="recency">Sort: Recency</option>
          </select>
        </div>
        <div id="historyStatus" class="hint" aria-live="polite"></div>
        <div id="historyContainer"></div>
      </div>
      <div slot="tab-content" tab-content="cookies" tab-label="Cookies">
        <input type="text" id="domainInput" list="domainsList" placeholder="Enter domain..." autocomplete="off">
        <datalist id="domainsList"></datalist>
        <button id="clearButton">Clear Data</button>
        <div id="status"></div>
      </div>
      <div slot="tab-content" tab-content="config" tab-label="⚙️">
        <button id="loadConfigBtn">Load Config</button>
        <div id="configContainer"></div>
      </div>
    </tab-widget>
    <script src="tab-widget.js"></script>
    <script src="actions.js"></script>
  </body>
</html>
